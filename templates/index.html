<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Check your email address</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--panel:rgba(21,21,23,.88);--line:#2c2c31;--ink:#f1efe8;--mute:#a1a1aa;--acid:#d7ff3a;--blue:#4a5bff;--blue-t:#9aa5ff;--coral:#ff6a55;
--display:"Unbounded","Arial Black",system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 72px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.title{padding:28px 26px;display:flex;flex-direction:column;gap:18px}
h1{font:800 clamp(1.7rem,5vw,3rem)/1.05 var(--display);letter-spacing:-.03em;margin:0;font-style:italic;color:var(--acid)}
.sub{margin:0;color:var(--mute);max-width:46ch}
#wave{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.2}
#banner{margin:0 0 12px;padding:10px 14px;border-radius:12px;border:1px solid var(--blue);color:var(--blue-t);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
label{font:600 .95rem var(--display);display:block;margin-bottom:10px}
textarea{width:100%;min-height:160px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:#0c0c0d;color:var(--ink);font:14px/1.6 var(--mono)}
textarea::placeholder{color:#6d6d76}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{font:600 .92rem system-ui,sans-serif;border-radius:999px;padding:10px 20px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:hover{background:#26262b}
button.primary{background:var(--acid);border-color:var(--acid);color:#0c0c0d}button.primary:hover{background:#e6ff7a}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--blue-t);outline-offset:2px}
.err{color:var(--coral);margin-top:10px;min-height:1px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.tile{border-radius:16px;padding:16px 18px}.tile b{display:block;font:800 2.4rem/1 var(--display)}.tile span{font-size:.9rem;font-weight:600}
.tile.deliverable{background:var(--acid);color:#0c0c0d}.tile.undeliverable{background:var(--coral);color:#0c0c0d}.tile.unknown{background:var(--blue);color:#fff}
.wrapt{overflow-x:auto;padding:6px 14px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}th{color:var(--mute);font-weight:600;font-size:.85rem}
td.em{font:.86rem var(--mono);word-break:break-all}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:.8rem;border:1.5px solid currentColor;white-space:nowrap}
.tag.deliverable{color:var(--acid)}.tag.undeliverable{color:var(--coral)}.tag.unknown{color:var(--blue-t)}
small{display:block;color:var(--mute);font-size:.82rem}
.note{color:var(--mute);font-size:.9rem;margin:12px 4px 0}
@media(max-width:720px){.sum{grid-template-columns:1fr}}
</style></head><body><main>
<section class="hero">
 <div class="title"><h1>Check your<br>email address</h1>
 <p class="sub">Paste addresses, one per line or separated by commas. Up to {{ max_addresses }} per run. No message is ever sent.</p></div>
</section>
<canvas id="wave" aria-hidden="true"></canvas>
<div id="banner" role="status" hidden></div>
<div class="panel">
 <label for="in">Addresses</label>
 <textarea id="in" placeholder="jane@example.com&#10;someone@gmail.com"></textarea>
 <div class="row"><button class="primary" id="go">Check addresses</button><button id="demo" type="button">Try sample data</button>
 <button id="csv" type="button" hidden>Download CSV</button></div>
 <div id="err" class="err" role="alert"></div>
</div>
<div id="out" hidden>
 <div class="sum" id="sum"></div>
 <div class="panel wrapt"><table><thead><tr><th>Address</th><th>Result</th><th>Why</th></tr></thead><tbody id="rows"></tbody></table></div>
 <p class="note"><b>Unknown</b> means the mail server would not confirm the mailbox. It is not a verdict that the address is bad.</p>
</div></main>
<script>
const $=id=>document.getElementById(id),LABEL={deliverable:"Likely delivered",undeliverable:"Likely to bounce",unknown:"Unknown"};
let last=[];

/* Wave: faint acid lines as the page background. Moves only while a check is running. */
const cv=$("wave"),ctx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let ph=0,raf=0;
function draw(){const d=devicePixelRatio||1,w=cv.width=cv.clientWidth*d,h=cv.height=cv.clientHeight*d,n=Math.max(18,Math.round(cv.clientHeight/24));
 ctx.clearRect(0,0,w,h);ctx.strokeStyle="#d7ff3a";ctx.lineWidth=1.6*d;
 for(let i=0;i<n;i++){ctx.beginPath();
  for(let x=0;x<=w;x+=6){const env=Math.sin(Math.PI*x/w),y=(i+.5)*h/n+env*h*.09*Math.sin(x/(w/9)+i*.38+ph);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.stroke()}}
function spin(){ph+=.07;draw();raf=requestAnimationFrame(spin)}
function waveOn(){if(!still&&!raf)spin()}
function waveOff(){cancelAnimationFrame(raf);raf=0;draw()}
addEventListener("resize",draw);draw();

/* Notice only when mailbox (SMTP) checks are unavailable on this server. */
fetch("/api/status").then(r=>r.json()).then(s=>{
 if(!s.smtp_probe){const b=$("banner");b.hidden=false;
  b.textContent="Mailbox checks are off on this server ("+s.detail+"). Syntax and domain checks still run; addresses at real domains will show as Unknown."}
}).catch(()=>{});

$("demo").onclick=()=>{$("in").value="not-an-email\nhello@this-domain-should-not-exist-98213.com\nsomeone@gmail.com\nname@example.com\nwebmaster@iana.org"};
function cell(tr,txt,cls){const td=document.createElement("td");if(cls)td.className=cls;td.textContent=txt;tr.appendChild(td);return td}
$("go").onclick=async()=>{
 const btn=$("go");$("err").textContent="";btn.disabled=true;btn.textContent="Checking…";waveOn();
 try{const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({emails:$("in").value})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");
  last=d.results;$("out").hidden=false;$("csv").hidden=false;
  $("sum").replaceChildren(...["deliverable","undeliverable","unknown"].map(k=>{const t=document.createElement("div");t.className="tile "+k;
   const b=document.createElement("b");b.textContent=d.summary[k];const s=document.createElement("span");s.textContent=LABEL[k];t.append(b,s);return t}));
  const body=$("rows");body.replaceChildren();
  d.results.forEach(x=>{const tr=document.createElement("tr");cell(tr,x.email,"em");
   const t=document.createElement("td"),tag=document.createElement("span");tag.className="tag "+x.status;tag.textContent=LABEL[x.status];t.appendChild(tag);tr.appendChild(t);
   const w=cell(tr,x.reason);if(x.flags.length){const f=document.createElement("small");f.textContent="Flags: "+x.flags.join(", ");w.appendChild(f)}
   if(x.smtp){const f=document.createElement("small");f.textContent="Server said: "+x.smtp;w.appendChild(f)}body.appendChild(tr)});
  if(d.truncated)$("err").textContent="Only the first "+d.limit+" addresses were checked."
 }catch(e){$("err").textContent=e.message}finally{btn.disabled=false;btn.textContent="Check addresses";waveOff()}};
$("csv").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const rows=[["email","status","reason","mx","smtp_reply","flags"],...last.map(x=>[x.email,x.status,x.reason,x.mx,x.smtp,x.flags.join(";")])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="results.csv";a.click()};
</script></body></html>
